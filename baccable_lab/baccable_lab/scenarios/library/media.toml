# Info-rozrywka i wyświetlacz wskaźników. Głównie na postoju.

[[scenario]]
id = "ipc_menu"
title = "Menu na wyświetlaczu: otwarcie, nadpisanie i przywrócenie"
group = "media"
vehicle = "stationary"
runs = 3
min_separation_s = 4
confounder_guard = ["źródło audio", "utwór", "telefon"]
notes = "Otwórz menu, pozwól ekranowi fabrycznemu je nadpisać, potem wróć do menu."
[[scenario.steps]]
action = "Otwórz menu na wyświetlaczu wskaźników"
expect = "ipc_menu_opened"
[[scenario.steps]]
action = "Pozwól, aby ekran fabryczny nadpisał menu"
expect = "ipc_menu_overwritten"
[[scenario.steps]]
action = "Wróć do menu na wyświetlaczu"
expect = "ipc_menu_restored"

