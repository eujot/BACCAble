group = "lighting"
vehicle = "stationary"
runs = 3
min_separation_s = 3
confounder_guard = ["hamulec postojowy", "kierunkowskazy", "bieg"]
notes = "Zapłon włączony, silnik zgaszony, bieg P. Naciskaj tylko pedał hamulca."
[[scenario.steps]]
action = "Naciśnij pedał hamulca"
expect = "brake_lights_on"
[[scenario.steps]]
action = "Zwolnij pedał hamulca"
expect = ""
