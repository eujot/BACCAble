# Oświetlenie zewnętrzne i wewnętrzne. Na postoju, o ile nie zaznaczono inaczej.

[[scenario]]
id = "indicator_left"
title = "Lewy kierunkowskaz: włączenie i wyłączenie"
group = "lighting"
vehicle = "stationary"
runs = 3
min_separation_s = 3
confounder_guard = ["prawy kierunkowskaz", "światła awaryjne", "reflektory", "hamulec"]
[[scenario.steps]]
action = "Lewy kierunkowskaz WŁ."
expect = "left_indicator_on"
[[scenario.steps]]
action = "Lewy kierunkowskaz WYŁ."
expect = "left_indicator_off"

