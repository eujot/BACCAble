# Dostęp, drzwi, szyby i lusterka. Wszystko na postoju.
# Każdy scenariusz powtarza pary WŁ./WYŁ., aby analiza wymagała powtórzonych,
# odwracalnych przejść z kontrolami negatywnymi.

[[scenario]]
id = "lock_unlock"
title = "Centralny zamek: zablokowanie i odblokowanie pilotem"
group = "access"
vehicle = "stationary"
runs = 3
min_separation_s = 3
confounder_guard = ["drzwi", "szyby", "zapłon", "światła"]
notes = "Dotykać tylko pilota; drzwi kierowcy zamknięte, aby zmieniał się sam stan zamka."
[[scenario.steps]]
action = "Naciśnij UNLOCK na pilocie, poczekaj na mignięcie kierunkowskazów"
expect = "unlock"
[[scenario.steps]]
action = "Naciśnij LOCK na pilocie, poczekaj na mignięcie kierunkowskazów"
expect = "lock"

[[scenario]]
id = "door_driver"
title = "Drzwi kierowcy: otwarcie i zamknięcie"
group = "access"
vehicle = "stationary"
runs = 3
min_separation_s = 3
confounder_guard = ["pozostałe drzwi", "szyby", "zapłon"]
notes = "Otwieraj tylko drzwi kierowcy. Zaznaczaj zaraz na początku ruchu."
[[scenario.steps]]
action = "Otwórz drzwi kierowcy"
expect = "driver_door_open"
[[scenario.steps]]
action = "Zamknij drzwi kierowcy"
expect = "driver_door_close"

