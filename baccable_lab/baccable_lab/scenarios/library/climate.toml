# Klimatyzacja i komfort. Na postoju, silnik pracuje lub zapłon włączony.

[[scenario]]
id = "ac_toggle"
title = "Klimatyzacja: włączenie i wyłączenie sprężarki"
group = "climate"
vehicle = "stationary"
runs = 3
min_separation_s = 4
confounder_guard = ["nawiew", "temperatura", "odmrażanie", "recyrkulacja"]
notes = "Nawiew powyżej minimum. Poczekaj kilka sekund na ustalenie stanu sprężarki."
[[scenario.steps]]
action = "Klimatyzacja WŁ. (świeci się płatek śniegu)"
expect = "ac_on"
[[scenario.steps]]
action = "Klimatyzacja WYŁ."
expect = "ac_off"

[[scenario]]
id = "climate_temperature"
title = "Zadana temperatura kabiny: podniesienie i obniżenie"
group = "climate"
vehicle = "stationary"
runs = 3
min_separation_s = 3
confounder_guard = ["nawiew", "klimatyzacja", "odmrażanie"]
[[scenario.steps]]
action = "Podnieś temperaturę zadaną o kilka stopni"
expect = "climate_temperature_changed"
[[scenario.steps]]
action = "Obniż temperaturę zadaną z powrotem"
expect = "climate_temperature_changed"

