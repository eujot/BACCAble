# Wycieraczki, spryskiwacz i czujnik deszczu.

[[scenario]]
id = "wipers_speeds"
title = "Wycieraczki: przerywane, wolne, szybkie i wyłączone"
group = "wipers"
vehicle = "stationary"
runs = 3
min_separation_s = 3
confounder_guard = ["spryskiwacz", "deszcz", "zapłon"]
notes = "Zapłon włączony. Po każdej pozycji poczekaj, aż się ustabilizuje."
[[scenario.steps]]
action = "Wycieraczki: tryb przerywany"
expect = "wipers_intermittent"
[[scenario.steps]]
action = "Wycieraczki: wolne (ciągłe)"
expect = "wipers_slow"
[[scenario.steps]]
action = "Wycieraczki: szybkie"
expect = "wipers_fast"
[[scenario.steps]]
action = "Wycieraczki: wyłączone"
expect = "wipers_off"

[[scenario]]
id = "washer"
title = "Spryskiwacz przedniej szyby"
group = "wipers"
vehicle = "stationary"
runs = 3
min_separation_s = 3
confounder_guard = ["pozycja wycieraczek", "deszcz"]
[[scenario.steps]]
action = "Pociągnij dźwignię spryskiwacza"
expect = "washer_used"
[[scenario.steps]]
action = "Puść i poczekaj, aż wycieraczki się zatrzymają"
expect = ""

[[scenario]]
id = "rear_wiper"
title = "Wycieraczka tylnej szyby: włączenie i wyłączenie"
group = "wipers"
vehicle = "stationary"
runs = 3
min_separation_s = 3
confounder_guard = ["przednie wycieraczki", "spryskiwacz"]
[[scenario.steps]]
action = "Wycieraczka tylna WŁ."
expect = "rear_wiper_on"
[[scenario.steps]]
action = "Wycieraczka tylna WYŁ."
expect = ""

[[scenario]]
id = "rain_sensing"
title = "Czujnik deszczu: zwilżenie i wyschnięcie"
group = "wipers"
vehicle = "any"
runs = 3
min_separation_s = 3
confounder_guard = ["ręczne wycieraczki", "spryskiwacz"]
notes = "Tryb przerywany/AUTO; podlej czujnik wodą, potem przestań i wysusz."
[[scenario.steps]]
action = "Podaj wodę na czujnik deszczu"
expect = "rain_detected"
[[scenario.steps]]
action = "Przestań polewać i wysusz czujnik"
expect = "rain_stopped"

[[scenario]]
id = "wipers_lights_auto"
title = "Wycieraczki → światła mijania (AUTO): praca ciągła i automatyczna"
group = "wipers"
vehicle = "stationary"
runs = 2
min_separation_s = 5
confounder_guard = ["przełącznik świateł", "spryskiwacz", "pozycja świateł"]
notes = "Wykonuj w dzień, przy jasnym otoczeniu, żeby AUTO nie włączyło świateł z powodu ciemności. Przełącznik świateł w AUTO. Każdy stan wycieraczek utrzymuj kilkanaście sekund; część automatyczną (kilka cykli w minucie) trzymaj około minuty."
[[scenario.steps]]
action = "Przełącznik świateł w AUTO (światła zgaszone — jasno)"
expect = "automatic_headlights_on"
[[scenario.steps]]
action = "Wycieraczki wyłączone — światła pozostają zgaszone (kontrola)"
expect = "wipers_off"
[[scenario.steps]]
action = "Wycieraczki: wolne (ciągłe) — trzymaj około 20 s"
expect = "wipers_slow"
[[scenario.steps]]
action = "Poczekaj, aż zapalą się światła mijania (ciągła praca wycieraczek)"
expect = "dipped_beam_on"
[[scenario.steps]]
action = "Wycieraczki: szybkie — trzymaj około 15 s"
expect = "wipers_fast"
[[scenario.steps]]
action = "Wyłącz wycieraczki — światła mają zgasnąć po chwili"
expect = "wipers_off"
[[scenario.steps]]
action = "Potwierdź wyłączenie świateł mijania"
expect = "dipped_beam_off"
[[scenario.steps]]
action = "Wycieraczki: tryb automatyczny (czujnik deszczu), podlej szybę — kilka cykli w minucie"
expect = "wipers_auto"
[[scenario.steps]]
action = "Poczekaj, aż zapalą się światła mijania (auto + kilka cykli)"
expect = "dipped_beam_on"
[[scenario.steps]]
action = "Wysusz lub zatrzymaj wycieraczki"
expect = "wipers_off"
[[scenario.steps]]
action = "Potwierdź wyłączenie świateł mijania po ustaniu wycieraczek"
expect = "dipped_beam_off"
