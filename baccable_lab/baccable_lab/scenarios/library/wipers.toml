# Wycieraczki, spryskiwacz i czujnik deszczu.

[[scenario]]
id = "wipers_speeds"
title = "Wycieraczki: przerywane, wolne, szybkie i wyłączone"
group = "wipers"
vehicle = "stationary"
runs = 3
min_separation_s = 3
confounder_guard = ["spryskiwacz", "deszcz", "zapłon"]
notes = "Zapłon włączony. Po każdej pozycji poczekaj, aż się ustabilizuje."
[[scenario.steps]]
action = "Wycieraczki: tryb przerywany"
expect = "wipers_intermittent"
[[scenario.steps]]
action = "Wycieraczki: wolne (ciągłe)"
expect = "wipers_slow"
[[scenario.steps]]
action = "Wycieraczki: szybkie"
expect = "wipers_fast"
[[scenario.steps]]
action = "Wycieraczki: wyłączone"
expect = "wipers_off"

[[scenario]]
id = "washer"
title = "Spryskiwacz przedniej szyby"
group = "wipers"
vehicle = "stationary"
runs = 3
min_separation_s = 3
confounder_guard = ["pozycja wycieraczek", "deszcz"]
[[scenario.steps]]
action = "Pociągnij dźwignię spryskiwacza"
expect = "washer_used"
[[scenario.steps]]
action = "Puść i poczekaj, aż wycieraczki się zatrzymają"
expect = ""

[[scenario]]
id = "rear_wiper"
title = "Wycieraczka tylnej szyby: włączenie i wyłączenie"
group = "wipers"
vehicle = "stationary"
runs = 3
min_separation_s = 3
confounder_guard = ["przednie wycieraczki", "spryskiwacz"]
[[scenario.steps]]
action = "Wycieraczka tylna WŁ."
expect = "rear_wiper_on"
[[scenario.steps]]
action = "Wycieraczka tylna WYŁ."
expect = ""

[[scenario]]
id = "rain_sensing"
title = "Czujnik deszczu: zwilżenie i wyschnięcie"
group = "wipers"
vehicle = "any"
runs = 3
min_separation_s = 3
confounder_guard = ["ręczne wycieraczki", "spryskiwacz"]
notes = "Tryb przerywany/AUTO; podlej czujnik wodą, potem przestań i wysusz."
[[scenario.steps]]
action = "Podaj wodę na czujnik deszczu"
expect = "rain_detected"
[[scenario.steps]]
action = "Przestań polewać i wysusz czujnik"
expect = "rain_stopped"

[[scenario]]
id = "rain_lights_auto"
title = "Czujnik jasności i deszczu (AUTO) w dzień: stan świateł mijania"
group = "wipers"
vehicle = "stationary"
runs = 3
min_separation_s = 0
confounder_guard = ["przełącznik świateł", "bieg", "silnik"]
notes = "Wykonuj w DZIEŃ, na zewnątrz, przy jasnym otoczeniu. Zapłon włączony, przełącznik świateł w AUTO, czułość czujnika deszczu pośrodku. Punkt wyjścia: czujnik jasności odsłonięty, więc światła mijania są ZGASZONE. Ciemność symulujesz nieprzezroczystą szmatką na czujniku za lusterkiem, a powrót do dnia przez jej zdjęcie. Latarka nie jest używana — w praktyce auto nie reaguje na doświetlanie czujnika. WAŻNE: auto fabrycznie NIE zapala świateł mijania od pracy wycieraczek ani od deszczu — to funkcja dopiero do dodania w firmware. Dlatego w fazach deszczu potwierdzasz, że światła POZOSTAJĄ zgaszone; to punkt odniesienia (kontrola negatywna). Faz deszczu nie wykonuj po zmroku ani w ciemnym garażu, bo AUTO zapali światła od ciemności i kontrola straci sens. Po wdrożeniu funkcji te same kroki zmieniasz na 'światła mijania zapaliły się'. Kolejność faz jest celowa: najpierw czujnik jasności przy WYŁĄCZONYCH wycieraczkach, potem deszcz przy jasnym otoczeniu. DRL świecą zawsze — oceniaj pełne światła mijania. Nie zasłaniaj czujnika nasłonecznienia na desce. Bez czasów: potwierdzasz efekt, gdy go widzisz, a kolejne powtórzenie zaczynasz, gdy światła i wycieraczki wrócą do stanu wyjściowego."
[[scenario.steps]]
action = "Czujnik jasności odsłonięty, wycieraczki WYŁ. — punkt odniesienia (jasno, światła zgaszone)"
expect = "light_sensor_bright"
[[scenario.steps]]
action = "Zasłoń czujnik jasności (szmatką)"
expect = "light_sensor_dark"
[[scenario.steps]]
action = "Światła mijania zapaliły się (AUTO od ciemności)"
expect = "dipped_beam_on"
[[scenario.steps]]
action = "Odsłoń czujnik jasności"
expect = "light_sensor_bright"
[[scenario.steps]]
action = "Światła mijania zgasły"
expect = "dipped_beam_off"
[[scenario.steps]]
action = "Wycieraczki AUTO, szyba sucha — wycieraczki nie pracują (kontrola)"
expect = "wipers_auto"
[[scenario.steps]]
action = "Spryskaj szybę — wycieraczki ruszyły"
expect = "rain_detected"
[[scenario.steps]]
action = "Światła mijania pozostały ZGASZONE (funkcji jeszcze nie ma)"
expect = "dipped_beam_off"
[[scenario.steps]]
action = "Przestań polewać i wysusz szybę — wycieraczki się zatrzymały"
expect = "rain_stopped"
[[scenario.steps]]
action = "Wycieraczki ręcznie: 3 pełne cykle pracy (trzy ruchy piór)"
expect = "wipers_slow"
[[scenario.steps]]
action = "Światła mijania pozostały ZGASZONE (funkcji jeszcze nie ma)"
expect = "dipped_beam_off"
[[scenario.steps]]
action = "Wyłącz wycieraczki"
expect = "wipers_off"
